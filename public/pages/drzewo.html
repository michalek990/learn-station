<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App — Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #1e1e1e;
  --sidebar: #252526;
  --sidebar-hover: #2a2d2e;
  --sidebar-active: #37373d;
  --editor: #1e1e1e;
  --tab-bar: #252526;
  --tab-active: #1e1e1e;
  --tab-inactive: #2d2d2d;
  --border: #3e3e42;
  --tx: #cccccc;
  --tx2: #858585;
  --tx3: #6e7681;
  --blue: #4ec9b0;
  --blue2: #9cdcfe;
  --green: #4ec94e;
  --green2: #6a9955;
  --violet: #c586c0;
  --yellow: #dcdcaa;
  --orange: #ce9178;
  --red: #f44747;
  --ts-blue: #007acc;
  --tsx-teal: #00b4b4;
  --json-yellow: #cbcb41;
  --js-yellow: #f5de19;
  --md-blue: #519aba;
  --sh-green: #89e051;
  --html-orange: #e34c26;
  --css-blue: #563d7c;
  --white: #d4d4d4;
  --keyword: #569cd6;
  --string: #ce9178;
  --comment: #6a9955;
  --type: #4ec9b0;
  --number: #b5cea8;
  --func: #dcdcaa;
  --prop: #9cdcfe;
  --indent: 12px;
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--tx);font-family:'JetBrains Mono',monospace;font-size:13px;display:flex;flex-direction:column}

/* TITLEBAR */
.titlebar{height:30px;background:#323233;display:flex;align-items:center;padding:0 16px;gap:8px;flex-shrink:0;border-bottom:1px solid #000;user-select:none}
.tb-dots{display:flex;gap:6px}
.tb-dot{width:12px;height:12px;border-radius:50%}
.tb-title{flex:1;text-align:center;font-size:11px;color:var(--tx2);letter-spacing:.3px}
.tb-icons{display:flex;gap:14px;color:var(--tx2);font-size:11px}

/* ACTIVITY BAR */
.layout{display:flex;flex:1;overflow:hidden}
.actbar{width:48px;background:#333333;display:flex;flex-direction:column;align-items:center;padding:4px 0;gap:2px;border-right:1px solid #000;flex-shrink:0}
.act-icon{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--tx2);cursor:pointer;border-radius:4px;font-size:14px;transition:color .15s;position:relative}
.act-icon:hover{color:var(--tx)}
.act-icon.active{color:#fff}
.act-icon.active::before{content:'';position:absolute;left:-4px;top:6px;bottom:6px;width:2px;background:#fff;border-radius:0 2px 2px 0}

/* SIDEBAR */
.sidebar{width:280px;background:var(--sidebar);display:flex;flex-direction:column;border-right:1px solid #000;flex-shrink:0;overflow:hidden}
.sidebar-title{height:35px;display:flex;align-items:center;padding:0 14px;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--tx2);flex-shrink:0}
.tree{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:20px}
.tree::-webkit-scrollbar{width:6px}
.tree::-webkit-scrollbar-track{background:transparent}
.tree::-webkit-scrollbar-thumb{background:#424242;border-radius:3px}
.tree::-webkit-scrollbar-thumb:hover{background:#555}

/* TREE ITEMS */
.tree-item{display:flex;align-items:center;height:22px;cursor:pointer;padding-right:8px;white-space:nowrap;position:relative;transition:background .08s}
.tree-item:hover{background:var(--sidebar-hover)}
.tree-item.active{background:var(--sidebar-active)}
.tree-item.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:1px;background:#007acc}
.tree-indent{display:inline-flex;align-items:center;flex-shrink:0}
.tree-indent-unit{width:var(--indent);height:100%;flex-shrink:0;position:relative}
.tree-arrow{width:16px;height:22px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--tx2);font-size:9px;transition:transform .15s}
.tree-arrow.open{transform:rotate(90deg)}
.tree-arrow.leaf{opacity:0;pointer-events:none}
.file-icon{font-size:13px;margin-right:5px;flex-shrink:0}
.tree-label{font-size:13px;color:var(--tx);overflow:hidden;text-overflow:ellipsis}
.tree-label.folder{color:#e8e8e8;font-weight:500}
.children{display:none}
.children.open{display:block}

/* MAIN EDITOR AREA */
.editor-area{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* TABS */
.tabs{height:35px;background:var(--tab-bar);display:flex;align-items:flex-end;overflow-x:auto;overflow-y:hidden;flex-shrink:0;border-bottom:1px solid #000}
.tabs::-webkit-scrollbar{height:3px}
.tabs::-webkit-scrollbar-thumb{background:#555}
.tab{display:flex;align-items:center;gap:6px;padding:0 14px 0 12px;height:35px;background:var(--tab-inactive);border-right:1px solid #000;cursor:pointer;white-space:nowrap;font-size:12px;color:var(--tx2);flex-shrink:0;position:relative;transition:background .1s}
.tab:hover{background:#2e2e2e}
.tab.active{background:var(--tab-active);color:var(--tx)}
.tab.active::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:#007acc}
.tab-icon{font-size:12px}
.tab-close{width:16px;height:16px;display:flex;align-items:center;justify-content:center;border-radius:3px;font-size:10px;opacity:0;transition:opacity .1s}
.tab:hover .tab-close{opacity:.6}
.tab.active .tab-close{opacity:.6}
.tab-close:hover{opacity:1!important;background:#555}

/* EDITOR CONTENT */
.editor-content{flex:1;overflow:hidden;display:flex;flex-direction:column}
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--tx2);gap:8px}
.welcome-logo{font-size:64px;opacity:.15;margin-bottom:8px}
.welcome-title{font-size:20px;color:var(--tx2);font-weight:300;letter-spacing:1px}
.welcome-sub{font-size:12px;color:var(--tx3)}

/* CODE VIEW */
.code-view{flex:1;overflow:auto;display:flex}
.code-view::-webkit-scrollbar{width:10px;height:10px}
.code-view::-webkit-scrollbar-track{background:#1e1e1e}
.code-view::-webkit-scrollbar-thumb{background:#424242}
.code-view::-webkit-scrollbar-thumb:hover{background:#555}
.line-numbers{width:50px;background:var(--editor);padding:16px 0;text-align:right;flex-shrink:0;user-select:none;border-right:1px solid #2d2d2d}
.ln{height:19px;line-height:19px;padding-right:12px;font-size:12px;color:#4a4a4a}
.code-lines{padding:16px 20px;flex:1;overflow:visible}
.cl{height:19px;line-height:19px;font-size:13px;white-space:pre}

/* DESCRIPTION PANEL */
.desc-panel{background:#252526;border-top:1px solid var(--border);padding:14px 20px;font-size:12px;line-height:1.8;color:#aaa;flex-shrink:0;max-height:110px;overflow-y:auto}
.desc-panel::-webkit-scrollbar{width:4px}
.desc-panel::-webkit-scrollbar-thumb{background:#424242}
.desc-title{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#569cd6;margin-bottom:4px}
.desc-panel b{color:#dcdcaa}

/* STATUSBAR */
.statusbar{height:22px;background:#007acc;display:flex;align-items:center;padding:0 12px;gap:16px;flex-shrink:0}
.sb-item{font-size:11px;color:rgba(255,255,255,.8);display:flex;align-items:center;gap:4px;cursor:pointer}
.sb-item:hover{color:#fff}
.sb-right{margin-left:auto;display:flex;gap:16px}

/* SYNTAX HIGHLIGHT */
.kw{color:#569cd6}
.st{color:#ce9178}
.cm{color:#6a9955}
.ty{color:#4ec9b0}
.nu{color:#b5cea8}
.fn{color:#dcdcaa}
.pr{color:#9cdcfe}
.op{color:#d4d4d4}
.at{color:#9cdcfe}
.tg{color:#4ec9b0}

/* RESPONSIVE */
@media(max-width:700px){.sidebar{width:220px}.actbar{width:36px}}
</style>
</head>

// ═══════════════════════════════════════════
// RENDER TREE
// ═══════════════════════════════════════════
function getFileIcon(node) {
  if (node.file && FILES[node.file]) return FILES[node.file].icon
  if (node.fileIcon) return node.fileIcon
  const ext = node.ext || (node.label.split('.').pop())
  const icons = { ts:'🟦', tsx:'🟩', json:'🟨', js:'🟡', md:'📄', sh:'🟢', html:'🟠', css:'🟣', lock:'🔒', rc:'⚙', cjs:'🟣' }
  return icons[ext] || '📄'
}

function getExtColor(node) {
  if (node.file && FILES[node.file]) return FILES[node.file].color
  const ext = node.ext || (node.label.includes('.') ? node.label.split('.').pop() : '')
  const colors = { ts:'#007acc', tsx:'#00b4b4', json:'#cbcb41', js:'#f5de19', md:'#519aba', sh:'#89e051', html:'#e34c26', css:'#563d7c', lock:'#89e051', rc:'#e37933', cjs:'#4b32c3' }
  return colors[ext] || '#858585'
}

// ═══════════════════════════════════════════
// GENERATE EXAMPLE CODE for unknown files
// ═══════════════════════════════════════════
function generateCode(label, ext) {
  const name = label.replace(/\.(tsx?|jsx?|json|md|sh|css|html)$/, '')
  const isTsx = ext === 'tsx'
  const isTs  = ext === 'ts'
  const isJson = ext === 'json'
  const isMd  = ext === 'md'
  const isSh  = ext === 'sh'
  const isCss = ext === 'css'

  if (label === 'index.ts' || label === 'public-api.ts') {
    return `<span class="cm">// ${label} — barrel export</span>\n<span class="kw">export</span> <span class="op">*</span> <span class="kw">from</span> <span class="st">'./public-api'</span>`
  }
  if (label === 'types.ts') {
    return `<span class="cm">// types.ts — interfejsy TypeScript</span>\n\n<span class="kw">export interface</span> <span class="ty">${name.charAt(0).toUpperCase() + name.slice(1)}Type</span> <span class="op">{</span>\n  id<span class="op">:</span>    <span class="ty">string</span>\n  name<span class="op">:</span>  <span class="ty">string</span>\n  value<span class="op">:</span> <span class="ty">number</span>\n<span class="op">}</span>`
  }
  if (isTsx && (label.includes('Page') || label.includes('page'))) {
    return `<span class="kw">const</span> <span class="fn">${name}</span> <span class="op">=</span> <span class="op">()</span> <span class="op">=&gt;</span> <span class="op">(</span>\n  <span class="op">&lt;</span><span class="tg">div</span> className<span class="op">=</span><span class="st">"p-6"</span><span class="op">&gt;</span>\n    <span class="op">&lt;</span><span class="tg">h1</span><span class="op">&gt;</span>${name}<span class="op">&lt;/</span><span class="tg">h1</span><span class="op">&gt;</span>\n  <span class="op">&lt;/</span><span class="tg">div</span><span class="op">&gt;</span>\n<span class="op">)</span>\n\n<span class="kw">export default</span> ${name}`
  }
  if (isTsx && label.includes('layout')) {
    return `<span class="kw">import</span> <span class="op">{</span> <span class="pr">Outlet</span> <span class="op">}</span> <span class="kw">from</span> <span class="st">'react-router-dom'</span>\n\n<span class="kw">const</span> <span class="fn">${name}</span> <span class="op">=</span> <span class="op">()</span> <span class="op">=&gt;</span> <span class="op">(</span>\n  <span class="op">&lt;</span><span class="tg">div</span><span class="op">&gt;</span>\n    <span class="op">&lt;</span><span class="tg">Outlet</span> <span class="op">/&gt;</span>\n  <span class="op">&lt;/</span><span class="tg">div</span><span class="op">&gt;</span>\n<span class="op">)</span>\n\n<span class="kw">export default</span> ${name}`
  }
  if (isTsx) {
    return `<span class="kw">import</span> <span class="op">{</span> <span class="kw">type</span> <span class="ty">FC</span> <span class="op">}</span> <span class="kw">from</span> <span class="st">'react'</span>\n\n<span class="kw">const</span> <span class="fn">${name}</span><span class="op">:</span> <span class="ty">FC</span> <span class="op">=</span> <span class="op">()</span> <span class="op">=&gt;</span> <span class="op">(</span>\n  <span class="op">&lt;</span><span class="tg">div</span> className<span class="op">=</span><span class="st">"flex items-center gap-2"</span><span class="op">&gt;</span>\n    <span class="cm">{/* ${name} */}</span>\n  <span class="op">&lt;/</span><span class="tg">div</span><span class="op">&gt;</span>\n<span class="op">)</span>\n\n<span class="kw">export default</span> ${name}`
  }
  if (isTs && label.includes('service')) {
    return `<span class="kw">import</span> <span class="pr">http</span> <span class="kw">from</span> <span class="st">'@/shared/utils/http-client'</span>\n\n<span class="kw">export const</span> ${name.charAt(0).toUpperCase() + name.slice(1)} <span class="op">=</span> <span class="op">{</span>\n  <span class="fn">getAll</span><span class="op">:</span> <span class="op">()</span> <span class="op">=&gt;</span> http.<span class="fn">get</span><span class="op">(</span><span class="st">'/${name}'</span><span class="op">),</span>\n  <span class="fn">getById</span><span class="op">:</span> <span class="op">(</span>id<span class="op">:</span> <span class="ty">string</span><span class="op">)</span> <span class="op">=&gt;</span> http.<span class="fn">get</span><span class="op">(</span><span class="st">\`/${name}/\${id}\`</span><span class="op">),</span>\n<span class="op">}</span>`
  }
  if (isTs && label.includes('context')) {
    return `<span class="kw">import</span> <span class="op">{</span> <span class="pr">createContext</span><span class="op">,</span> <span class="pr">useContext</span> <span class="op">}</span> <span class="kw">from</span> <span class="st">'react'</span>\n\n<span class="kw">export const</span> ${name}Context <span class="op">=</span> <span class="fn">createContext</span><span class="op">&lt;</span><span class="ty">any</span><span class="op">&gt;(</span><span class="kw">null</span><span class="op">)</span>\n\n<span class="kw">export const</span> <span class="fn">use${name.charAt(0).toUpperCase() + name.slice(1)}</span> <span class="op">=</span> <span class="op">()</span> <span class="op">=&gt;</span> <span class="op">{</span>\n  <span class="kw">const</span> ctx <span class="op">=</span> <span class="fn">useContext</span><span class="op">(</span>${name}Context<span class="op">)</span>\n  <span class="kw">if</span> <span class="op">(!</span>ctx<span class="op">)</span> <span class="kw">throw new</span> <span class="fn">Error</span><span class="op">(</span><span class="st">'Missing provider'</span><span class="op">)</span>\n  <span class="kw">return</span> ctx\n<span class="op">}</span>`
  }
  if (isTs && label.includes('provider')) {
    return `<span class="kw">import</span> <span class="op">{</span> <span class="pr">useState</span> <span class="op">}</span> <span class="kw">from</span> <span class="st">'react'</span>\n\n<span class="kw">export const</span> <span class="fn">${name}</span> <span class="op">=</span> <span class="op">({</span> children <span class="op">})</span> <span class="op">=&gt;</span> <span class="op">{</span>\n  <span class="kw">const</span> <span class="op">[</span>state<span class="op">,</span> setState<span class="op">]</span> <span class="op">=</span> <span class="fn">useState</span><span class="op">(</span><span class="kw">null</span><span class="op">)</span>\n\n  <span class="kw">return</span> <span class="op">(</span>\n    <span class="op">&lt;</span><span class="tg">Context.Provider</span> value<span class="op">={{</span> state<span class="op">,</span> setState <span class="op">}}&gt;</span>\n      <span class="op">{</span>children<span class="op">}</span>\n    <span class="op">&lt;/</span><span class="tg">Context.Provider</span><span class="op">&gt;</span>\n  <span class="op">)</span>\n<span class="op">}</span>`
  }
  if (isTs && label.includes('config')) {
    return `<span class="kw">export const</span> config <span class="op">=</span> <span class="op">{</span>\n  baseURL<span class="op">:</span> <span class="kw">import</span>.meta.env.VITE_API_URL<span class="op">,</span>\n  timeout<span class="op">:</span> <span class="nu">30000</span><span class="op">,</span>\n  retries<span class="op">:</span> <span class="nu">3</span><span class="op">,</span>\n<span class="op">}</span>`
  }
  if (isTs && (label.includes('utils') || label.includes('helper'))) {
    return `<span class="cm">// utils / helper functions</span>\n\n<span class="kw">export const</span> <span class="fn">formatDate</span> <span class="op">=</span> <span class="op">(</span>date<span class="op">:</span> <span class="ty">string</span><span class="op">)</span> <span class="op">=&gt;</span>\n  <span class="kw">new</span> <span class="fn">Date</span><span class="op">(</span>date<span class="op">).</span><span class="fn">toLocaleDateString</span><span class="op">(</span><span class="st">'pl-PL'</span><span class="op">)</span>\n\n<span class="kw">export const</span> <span class="fn">truncate</span> <span class="op">=</span> <span class="op">(</span>str<span class="op">:</span> <span class="ty">string</span><span class="op">,</span> n <span class="op">=</span> <span class="nu">50</span><span class="op">)</span> <span class="op">=&gt;</span>\n  str.length <span class="op">&gt;</span> n <span class="op">?</span> str.<span class="fn">slice</span><span class="op">(</span><span class="nu">0</span><span class="op">,</span> n<span class="op">) +</span> <span class="st">'...'</span> <span class="op">:</span> str`
  }
  if (isJson) {
    return `<span class="op">{</span>\n  <span class="pr">"name"</span><span class="op">:</span> <span class="st">"${name}"</span><span class="op">,</span>\n  <span class="pr">"version"</span><span class="op">:</span> <span class="st">"1.0.0"</span>\n<span class="op">}</span>`
  }
  if (isCss) {
    return `<span class="cm">/* globals.css */</span>\n<span class="kw">@tailwind</span> base<span class="op">;</span>\n<span class="kw">@tailwind</span> components<span class="op">;</span>\n<span class="kw">@tailwind</span> utilities<span class="op">;</span>\n\n<span class="kw">:root</span> <span class="op">{</span>\n  <span class="pr">--primary</span><span class="op">:</span> <span class="nu">222.2 47.4% 11.2%</span><span class="op">;</span>\n  <span class="pr">--background</span><span class="op">:</span> <span class="nu">0 0% 100%</span><span class="op">;</span>\n<span class="op">}</span>`
  }
  if (isMd) {
    return `<span class="fn"># ${name}</span>\n\n<span class="cm">Dokumentacja dla modułu \`${name}\`.</span>\n\n<span class="fn">## Użycie</span>\n\n<span class="op">\`\`\`ts</span>\nimport { ... } from './${name}'\n<span class="op">\`\`\`</span>`
  }
  if (isSh) {
    return `#!/usr/bin/env sh\n<span class="cm"># ${label}</span>\n\necho <span class="st">"Running ${name}..."</span>`
  }
  // default TS
  return `<span class="cm">// ${label}</span>\n\n<span class="kw">export const</span> ${name.replace(/[^a-zA-Z0-9]/g,'_')} <span class="op">=</span> <span class="op">{}</span>`
}

function buildTree(nodes, depth = 0) {
  return nodes.map(node => {
    const isFolder = node.type === 'folder' || node.type === 'root'
    const icon = isFolder ? (node.type === 'root' ? '📁' : '📂') : getFileIcon(node)
    const color = isFolder ? '#e8e8e8' : getExtColor(node)
    const indent = Array(depth).fill('<span class="tree-indent-unit"></span>').join('')
    const arrowClass = isFolder ? (node.open ? 'tree-arrow open' : 'tree-arrow') : 'tree-arrow leaf'
    const labelClass = isFolder ? 'tree-label folder' : 'tree-label'
    const ext = node.ext || (node.label.includes('.') ? node.label.split('.').pop() : '')
    const clickable = isFolder
      ? `onclick="toggleFolder(this)"`
      : `onclick="openAny('${node.file||''}','${node.label}','${ext}',this)"`

    let html = `<div class="tree-item" ${clickable} data-depth="${depth}">
      <span class="tree-indent">${indent}</span>
      <span class="${arrowClass}">▶</span>
      <span class="file-icon">${icon}</span>
      <span class="${labelClass}" style="color:${color}">${node.label}</span>
    </div>`

    if (isFolder && node.children && node.children.length > 0) {
      html += `<div class="children ${node.open ? 'open' : ''}">${buildTree(node.children, depth + 1)}</div>`
    }
    return html
  }).join('')
}

document.getElementById('tree').innerHTML = buildTree(TREE)

// ═══════════════════════════════════════════
// INTERACTIONS
// ═══════════════════════════════════════════
let openTabs = []
let activeTab = null

function toggleFolder(el) {
  const arrow = el.querySelector('.tree-arrow')
  const children = el.nextElementSibling
  if (!children || !children.classList.contains('children')) return
  arrow.classList.toggle('open')
  children.classList.toggle('open')
}

function openAny(fileKey, label, ext, el) {
  // highlight
  document.querySelectorAll('.tree-item').forEach(i => i.classList.remove('active'))
  el.classList.add('active')

  // use existing FILES entry or create a temporary generated one
  const tabKey = fileKey || label
  if (fileKey && FILES[fileKey]) {
    // known file — use as is
  } else {
    // generate example on the fly
    FILES[tabKey] = {
      icon: getFileIconByExt(ext),
      ext: ext || 'ts',
      color: getColorByExt(ext),
      desc: `<b>${label}</b> — przykładowy kod dla tego pliku. W prawdziwym projekcie zawartość zależy od konkretnej implementacji.`,
      code: generateCode(label, ext)
    }
  }

  if (!openTabs.includes(tabKey)) {
    openTabs.push(tabKey)
  }
  setActiveTab(tabKey)
}

function getFileIconByExt(ext) {
  const m = {ts:'🟦',tsx:'🟩',json:'🟨',js:'🟡',md:'📄',sh:'🟢',html:'🟠',css:'🟣',lock:'🔒'}
  return m[ext] || '📄'
}
function getColorByExt(ext) {
  const m = {ts:'#007acc',tsx:'#00b4b4',json:'#cbcb41',js:'#f5de19',md:'#519aba',sh:'#89e051',html:'#e34c26',css:'#563d7c',lock:'#89e051'}
  return m[ext] || '#858585'
}

function renderTabs() {
  const tabsEl = document.getElementById('tabs')
  tabsEl.innerHTML = openTabs.map(key => {
    const d = FILES[key]
    const label = d ? key.replace(/-(file|barrel|provider|src)$/, '') : key
    return `<div class="tab ${key === activeTab ? 'active' : ''}" onclick="setActiveTab('${key}')">
      <span class="tab-icon">${d ? d.icon : '📄'}</span>
      <span>${label}</span>
      <span class="tab-close" onclick="closeTab(event,'${key}')">✕</span>
    </div>`
  }).join('')
}

function setActiveTab(key) {
  activeTab = key
  renderTabs()
  renderEditor(key)
  const ext = FILES[key] ? FILES[key].ext : ''
  document.getElementById('sb-lang').textContent = ext ? ext.toUpperCase() : '—'
}

function closeTab(e, key) {
  e.stopPropagation()
  openTabs = openTabs.filter(k => k !== key)
  if (activeTab === key) activeTab = openTabs[openTabs.length - 1] || null
  renderTabs()
  if (activeTab) renderEditor(activeTab)
  else {
    document.getElementById('editor-content').innerHTML = `<div class="welcome">
      <div class="welcome-logo">⬡</div>
      <div class="welcome-title">App Explorer</div>
      <div class="welcome-sub">Kliknij na plik żeby zobaczyć kod i opis</div>
    </div>`
    document.getElementById('sb-lang').textContent = '—'
  }
}

function renderEditor(key) {
  const d = FILES[key]
  if (!d) return
  const lines = d.code.split('\n')
  const lineNums = lines.map((_, i) => `<div class="ln">${i + 1}</div>`).join('')
  const codeLines = lines.map(l => `<div class="cl">${l}</div>`).join('')
  document.getElementById('editor-content').innerHTML = `
    <div class="code-view">
      <div class="line-numbers">${lineNums}</div>
      <div class="code-lines">${codeLines}</div>
    </div>
    <div class="desc-panel">
      <div class="desc-title">📌 Co to jest i do czego służy</div>
      ${d.desc}
    </div>
  `
}
